name: QMoosa Chips CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Automated Verification Suite
        run: npm test

      - name: Run Full End-to-End Automation
        run: npm run automate

      - name: Check x402 Bazaar Synchronization
        run: npm run x402:sync
